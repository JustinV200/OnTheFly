<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>On the Fly</title>
    <meta
      name="description"
      content="On the Fly is a task market for business spend: businesses publish what they pay for a service, and other businesses bid to do it for less."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <!-- Sets the theme before the first paint, so a dark-mode viewer never sees a white flash on a cold load.
         Mirrors src/shared/theme (same "theme" storage key); ThemeProvider takes over once React mounts. -->
    <script>
      (function () {
        var preference = 'system';
        try {
          preference = window.localStorage.getItem('theme') || 'system';
        } catch (error) {
          // Storage can be refused (private mode); following the system theme is the safe fallback.
        }
        var isDark = preference === 'dark' || (preference !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
      })();
    </script>
    <!-- The brand mark inlined as an SVG data URI (same drawing as src/app/shell/topbar/BrandMark.tsx), so no favicon request can 404. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23037f55'/%3E%3Cg fill='%23fff'%3E%3Cellipse cx='10.2' cy='18.6' rx='3.9' ry='8.2' fill-opacity='.55' transform='rotate(38 10.2 18.6)'/%3E%3Cellipse cx='21.8' cy='18.6' rx='3.9' ry='8.2' fill-opacity='.55' transform='rotate(-38 21.8 18.6)'/%3E%3Cellipse cx='16' cy='17.4' rx='3.3' ry='7.6'/%3E%3Ccircle cx='16' cy='8.4' r='3.1'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
